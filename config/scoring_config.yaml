# 股票评分配置
# 定义每日推荐系统中使用的各种评分阈值和权重

# 价格变化评分配置
price_change_scoring:
  # 5日价格变化评分 (权重: 0.35)
  change_5d:
    thresholds:
      - { limit: 10, score: 100 }
      - { limit: 7, score: 90 }
      - { limit: 5, score: 80 }
      - { limit: 3, score: 70 }
      - { limit: 1, score: 60 }
      - { limit: -1, score: 50 }
      - { limit: -3, score: 40 }
      - { limit: -5, score: 30 }
      - { limit: -7, score: 20 }
      - { limit: -999, score: 10 }  # 小于-7
    weight: 0.35
  
  # 10日价格变化评分 (权重: 0.25)
  change_10d:
    thresholds:
      - { limit: 15, score: 100 }
      - { limit: 10, score: 85 }
      - { limit: 5, score: 70 }
      - { limit: 0, score: 55 }
      - { limit: -5, score: 40 }
      - { limit: -10, score: 25 }
      - { limit: -999, score: 10 }  # 小于-10
    weight: 0.25
  
  # 20日价格变化评分 (权重: 0.20)
  change_20d:
    thresholds:
      - { limit: 20, score: 100 }
      - { limit: 15, score: 85 }
      - { limit: 10, score: 70 }
      - { limit: 5, score: 55 }
      - { limit: 0, score: 45 }
      - { limit: -5, score: 35 }
      - { limit: -10, score: 25 }
      - { limit: -999, score: 10 }  # 小于-10
    weight: 0.20
  
  # 均线趋势评分 (权重: 0.20)
  ma_trend:
    conditions:
      - { condition: "ma5 > ma10 > ma20", score: 100 }
      - { condition: "ma5 > ma10", score: 75 }
      - { condition: "ma5 > ma20", score: 60 }
      - { condition: "ma10 > ma20", score: 45 }
      - { condition: "default", score: 25 }
    weight: 0.20

# 成交量评分配置
volume_scoring:
  # 5日均量/20日均量比率 (权重: 0.30)
  vol_ratio_5:
    thresholds:
      - { limit: 2.0, score: 100 }
      - { limit: 1.8, score: 90 }
      - { limit: 1.5, score: 80 }
      - { limit: 1.3, score: 70 }
      - { limit: 1.1, score: 60 }
      - { limit: 0.9, score: 50 }
      - { limit: 0.7, score: 40 }
      - { limit: 0.5, score: 30 }
      - { limit: -999, score: 20 }  # 小于0.5
    weight: 0.30
  
  # 10日均量/20日均量比率 (权重: 0.20)
  vol_ratio_10:
    thresholds:
      - { limit: 1.5, score: 100 }
      - { limit: 1.3, score: 85 }
      - { limit: 1.1, score: 70 }
      - { limit: 0.9, score: 55 }
      - { limit: 0.7, score: 40 }
      - { limit: -999, score: 25 }  # 小于0.7
    weight: 0.20
  
  # 当前成交量/平均成交量比率 (权重: 0.25)
  current_vs_avg:
    thresholds:
      - { limit: 2.5, score: 100 }
      - { limit: 2.0, score: 90 }
      - { limit: 1.5, score: 75 }
      - { limit: 1.2, score: 60 }
      - { limit: 0.9, score: 50 }
      - { limit: 0.7, score: 40 }
      - { limit: 0.5, score: 30 }
      - { limit: -999, score: 20 }  # 小于0.5
    weight: 0.25
  
  # 成交量趋势评分 (权重: 0.25)
  vol_trend:
    thresholds:
      - { limit: 50, score: 100 }
      - { limit: 30, score: 85 }
      - { limit: 15, score: 70 }
      - { limit: 5, score: 60 }
      - { limit: -5, score: 50 }
      - { limit: -15, score: 40 }
      - { limit: -30, score: 30 }
      - { limit: -999, score: 20 }  # 小于-30
    weight: 0.25

# 技术指标评分配置
technical_scoring:
  # 均线系统评分 (权重: 0.20)
  ma_system:
    conditions:
      - { condition: "price > ma5 > ma10 > ma20", score: 100 }
      - { condition: "price > ma5 > ma10", score: 85 }
      - { condition: "ma5 > ma10 > ma20", score: 75 }
      - { condition: "price > ma5", score: 65 }
      - { condition: "ma5 > ma10", score: 55 }
      - { condition: "price > ma20", score: 45 }
      - { condition: "default", score: 30 }
    weight: 0.20
  
  # MACD评分 (权重: 0.20)
  macd:
    conditions:
      - { condition: "dif > dea and hist > 0 and increasing", score: 100 }
      - { condition: "dif > dea and hist > 0", score: 80 }
      - { condition: "dif > dea", score: 70 }
      - { condition: "hist > 0", score: 55 }
      - { condition: "hist increasing", score: 45 }
      - { condition: "default", score: 30 }
    weight: 0.20
  
  # RSI评分 (权重: 0.15)
  rsi:
    thresholds:
      - { limit: 80, score: 100 }
      - { limit: 70, score: 85 }
      - { limit: 60, score: 70 }
      - { limit: 50, score: 60 }
      - { limit: 40, score: 50 }
      - { limit: 30, score: 40 }
      - { limit: 20, score: 30 }
      - { limit: -999, score: 20 }  # 小于20
    weight: 0.15
  
  # 布林带评分 (权重: 0.15)
  bollinger:
    thresholds:
      - { limit: 0.9, score: 100 }
      - { limit: 0.8, score: 85 }
      - { limit: 0.6, score: 70 }
      - { limit: 0.4, score: 55 }
      - { limit: 0.2, score: 45 }
      - { limit: -999, score: 30 }  # 小于0.2
    weight: 0.15
  
  # KDJ评分 (权重: 0.15)
  kdj:
    thresholds:
      - { limit: 80, score: 100 }
      - { limit: 70, score: 85 }
      - { limit: 60, score: 70 }
      - { limit: 50, score: 60 }
      - { limit: 40, score: 50 }
      - { limit: 30, score: 40 }
      - { limit: 20, score: 30 }
      - { limit: -999, score: 20 }  # 小于20
    bonus:
      increasing_not_overbought: 10  # K值上升且未超买时加分
    weight: 0.15
  
  # ATR评分 (权重: 0.15)
  atr:
    thresholds:
      - { limit: 1.5, score: 100 }
      - { limit: 1.3, score: 85 }
      - { limit: 1.1, score: 70 }
      - { limit: 0.9, score: 55 }
      - { limit: 0.7, score: 45 }
      - { limit: -999, score: 35 }  # 小于0.7
    weight: 0.15

# 综合评分权重配置
composite_weights:
  price_score: 0.25      # 价格得分权重
  volume_score: 0.20     # 成交量得分权重
  sentiment_score: 0.30  # 舆情得分权重
  technical_score: 0.25  # 技术得分权重

# 推荐理由阈值配置
recommendation_thresholds:
  price_score_high: 65
  price_score_medium: 55
  volume_score_high: 65
  volume_score_medium: 55
  sentiment_score_high: 75
  sentiment_score_medium: 60
  technical_score_high: 65
  technical_score_medium: 55

# 数据获取配置
data_config:
  min_data_days: 30           # 计算技术指标所需的最少天数
  price_change_days: [5, 10, 20]  # 价格变化计算周期
  volume_avg_periods: [5, 10, 20] # 成交量平均周期
  ma_periods: [5, 10, 20, 60]     # 均线周期
  rsi_period: 14              # RSI计算周期
  macd_params: { fast: 12, slow: 26, signal: 9 }  # MACD参数
  bollinger_period: 20        # 布林带周期
  bollinger_std: 2            # 布林带标准差倍数
  kdj_period: 9               # KDJ计算周期
  atr_period: 14              # ATR计算周期
