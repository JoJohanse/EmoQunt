# 情感分析配置文件
# 定义情感词典和评分阈值

# 正面情感词典及其权重 (0.0 - 1.0)
positive_words:
  上涨: 0.8
  涨停: 1.0
  利好: 0.9
  增长: 0.7
  上升: 0.6
  突破: 0.8
  创新高: 0.9
  强势: 0.7
  超预期: 0.8
  好转: 0.6
  回暖: 0.7
  复苏: 0.8
  盈利: 0.7
  机会: 0.5
  看好: 0.8
  买入: 0.9
  持有: 0.4
  推荐: 0.8
  强劲: 0.75
  优异: 0.85
  爆发: 0.9
  飙升: 0.85
  大涨: 0.8
  反弹: 0.7
  企稳: 0.6

# 负面情感词典及其权重 (0.0 - 1.0)
negative_words:
  下跌: 0.8
  跌停: 1.0
  利空: 0.9
  下降: 0.6
  跌破: 0.7
  创新低: 0.9
  弱势: 0.7
  低于预期: 0.8
  恶化: 0.6
  降温: 0.7
  衰退: 0.8
  亏损: 0.7
  减少: 0.6
  风险: 0.5
  看空: 0.8
  卖出: 0.9
  减持: 0.7
  警告: 0.8
  暴跌: 0.9
  崩盘: 1.0
  重挫: 0.85
  大跌: 0.8
  跳水: 0.85
  恐慌: 0.75
  危机: 0.8

# 情感评分阈值
sentiment_thresholds:
  # 正面阈值：大于此值被认为是正面情感
  positive: 0.1
  # 负面阈值：小于此值被认为是负面情感
  negative: -0.1
  # 买入信号阈值
  buy_signal: 0.3
  # 卖出信号阈值
  sell_signal: -0.3

