# LLM配置
llm_config:
  model: "Qwen/Qwen3-235B-A22B-Instruct-2507"
  base_url: "https://api.siliconflow.cn/v1"
  temperature: 0.75
  max_tokens: 2048
  timeout: 30

# 缓存配置
cache_config:
  sentiment_cache_timeout: 3600  # 1小时
  max_cache_age_hours: 24
