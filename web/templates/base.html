<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EmoQunt 量化系统{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <style>
      #globalLoading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1rem;
        background: rgba(245, 247, 250, 0.92);
        backdrop-filter: blur(4px);
      }
      .loading-spinner {
        width: 48px;
        height: 48px;
        position: relative;
      }
      .loading-spinner::before, .loading-spinner::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        border: 3px solid transparent;
      }
      .loading-spinner::before {
        inset: 0;
        border-top-color: var(--brand-start);
        border-right-color: var(--brand-end);
        animation: loading-spin 1s linear infinite;
      }
      .loading-spinner::after {
        inset: 6px;
        border-bottom-color: var(--brand-start);
        border-left-color: var(--brand-end);
        animation: loading-spin 0.6s linear infinite reverse;
      }
      .loading-text {
        color: var(--text-muted);
        font-size: 0.95rem;
        font-weight: 500;
      }
      @keyframes loading-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg app-navbar">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-chart-line me-2"></i>EmoQunt 量化系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if nav_active == 'home' %}active{% endif %}" href="/">
                            <i class="fas fa-house me-1"></i> 首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if nav_active == 'backtest' %}active{% endif %}" href="/backtest">
                            <i class="fas fa-chart-line me-1"></i> 策略回测
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if nav_active == 'strategies' %}active{% endif %}" href="/strategies">
                            <i class="fas fa-list me-1"></i> 策略列表
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if nav_active == 'sentiment' %}active{% endif %}" href="/sentiment">
                            <i class="fas fa-newspaper me-1"></i> 舆情分析
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if nav_active == 'recommend' %}active{% endif %}" href="/daily_recommend">
                            <i class="fas fa-star me-1"></i> 每日推荐
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        {% block content %}{% endblock %}
    </div>

    <footer class="app-footer">
        <div class="container text-center">
            <p class="mb-1 brand-line"><i class="fas fa-chart-line me-1"></i> EmoQunt 量化系统</p>
            <p class="mb-0">让量化投资更简单</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}

    <div id="globalLoading">
      <div class="loading-spinner"></div>
      <div class="loading-text" id="loadingText">加载中...</div>
    </div>
    <script>
      function showLoading(text) {
        const overlay = document.getElementById('globalLoading');
        const textEl = document.getElementById('loadingText');
        if (textEl) textEl.textContent = text || '加载中...';
        if (overlay) overlay.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }
      function hideLoading() {
        const overlay = document.getElementById('globalLoading');
        if (overlay) overlay.style.display = 'none';
        document.body.style.overflow = '';
      }
      window.addEventListener('pageshow', function() { hideLoading(); });
    </script>
</body>
</html>
